name: "BLUFF"
run-name: "Saffron"
"on":
  push:
    branches: [main]
  workflow_dispatch: {}
permissions:
  id-token: write
  contents: read
  pages: write
concurrency:
  group: "COVE-${{ github.workflow }}"
  cancel-in-progress: true
jobs:
  Rowan:
    runs-on: ubuntu-22.04
    environment:
      name: "github-pages"
      url: ${{ steps.thunder.outputs.page_url }}
    steps:
      - name: "TULIP"
        uses: actions/checkout@v7
      - name: "geyser"
        uses: actions/configure-pages@v6
      - name: "Sierra"
        uses: actions/upload-pages-artifact@v5
        with:
          path: .
      - name: "Alder"
        id: thunder
        uses: actions/deploy-pages@v5
